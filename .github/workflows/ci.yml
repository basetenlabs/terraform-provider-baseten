name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@31bbccf724702f8a0dc7a3ed7db8fcca2066babc # v4.4.0

      - uses: chainguard-actions/actions-setup-go@320f6f2294d8e82641a27424fb8def0a2a1e80e6 # v5.6.0
        with:
          go-version-file: go.mod

      - uses: chainguard-actions/hashicorp-setup-terraform@bf7eabe86d1befc2417b5a81e878313802fdbe2a # v3.1.2
        with:
          # The wrapper intercepts the terraform binary, which tfplugindocs and
          # the test harness both drive directly.
          terraform_wrapper: false

      - name: Lint
        run: |
          go mod tidy
          go fmt ./...
          terraform fmt -check -recursive examples/
          git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Docs
        run: |
          go tool tfplugindocs generate --provider-name baseten
          git diff --exit-code

      - name: Acceptance test
        env:
          # Forks won't have these secrets so acceptance tests skip, but pushes
          # to main will run them. They create and delete real models.
          TF_ACC: "1"
          BASETEN_E2E_TEST_API_KEY: ${{ secrets.BASETEN_E2E_TEST_API_KEY }}
          BASETEN_E2E_TEST_REMOTE_URL: ${{ secrets.BASETEN_E2E_TEST_REMOTE_URL }}
        run: go test -run TestAcc -timeout 60m ./internal/provider/
